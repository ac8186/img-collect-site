<title>问题浏览 · 小区物业管理问题汇总</title>

<script>
/* 部署到自己的 Supabase 项目时，只需修改这里的三项配置 */
const CONFIG = {
  SUPABASE_URL: 'https://jcaexhqpmbucaezwoczx.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjYWV4aHFwbWJ1Y2FlendvY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1NzQxOTMsImV4cCI6MjExMTE1MDE5M30.b5GKakyaNMCHxswcq3nqm-4wHpuNKHN_AAI1iTpg-8o',
  BUCKET: 'uploads',

  /* 分页 */
  PAGE_SIZE: 24,

  /* 四类问题分类（顺序即筛选顺序） */
  CATEGORY_ORDER: ['停车管理', '卫生问题', '安全隐患', '其他问题']
};
</script>

<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --line:#e5e7eb; --text:#1d1f23; --sub:#6b7280;
    --primary:#3f7cff; --ok:#0a7a2a; --err:#b32a2a; --warn:#a85b00; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); line-height:1.6; padding:28px 16px 56px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px; margin:0 auto;}

  header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  h1{font-size:22px; margin:0; letter-spacing:.4px;}
  .sub-line{margin:6px 0 0; font-size:13px; color:var(--sub);}
  header a{font-size:13.5px; color:#fff; background:var(--primary); text-decoration:none; white-space:nowrap;
    padding:8px 14px; border-radius:9px; font-weight:600;}
  header a:hover{background:#2f66e0;}

  .banner{margin-bottom:16px; padding:12px 14px; border-radius:10px; font-size:13px; border:1px solid var(--line); background:#fff; color:var(--sub);}
  .banner.err{background:rgba(245,63,63,.06); border-color:rgba(245,63,63,.3); color:#b32a2a;}
  .banner.warn{background:rgba(255,125,0,.07); border-color:rgba(255,125,0,.3); color:#a85b00;}
  .banner code{background:rgba(0,0,0,.05); padding:1px 5px; border-radius:4px; font-size:12px;}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .chip{
    padding:7px 15px; font-size:13.5px; border-radius:999px; cursor:pointer; font-family:inherit;
    border:1px solid var(--line); background:#fff; color:var(--sub); transition:.15s;
  }
  .chip:hover{border-color:#c9cdd4; color:var(--text);}
  .chip.active{background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:16px;}
  @media (max-width:520px){ .grid{grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px;} }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    display:flex; flex-direction:column; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.08); border-color:#c7d2fe;}
  .thumb{position:relative; width:100%; aspect-ratio:4/3; background:#f2f3f5; overflow:hidden;}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .ph{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#9ca3af; font-size:12.5px;}

  .body{padding:11px 12px 13px; display:flex; flex-direction:column; gap:6px;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .tag{
    font-size:11.5px; padding:2px 8px; border-radius:6px; font-weight:600; white-space:nowrap;
    background:rgba(63,124,255,.1); color:#2f66e0;
  }
  .tag[data-t="卫生问题"]{background:rgba(0,180,42,.1); color:#0a7a2a;}
  .tag[data-t="安全隐患"]{background:rgba(245,63,63,.1); color:#b32a2a;}
  .tag[data-t="其他问题"]{background:rgba(107,114,128,.13); color:#4b5563;}
  .time{font-size:11.5px; color:var(--sub); white-space:nowrap;}
  .desc{
    font-size:13px; color:#374151; margin:0; line-height:1.6;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    word-break:break-word;
  }

  .state{margin:40px auto; max-width:420px; text-align:center; font-size:13.5px; color:var(--sub);}
  .state .big{font-size:34px; line-height:1; margin-bottom:12px; opacity:.35;}
  #sentinel{height:1px;}
  .loading{text-align:center; padding:22px 0; font-size:13px; color:var(--sub);}

  /* 灯箱 */
  .lightbox{
    position:fixed; inset:0; z-index:1000; display:none; align-items:center; justify-content:center;
    padding:24px; background:rgba(17,19,23,.86); backdrop-filter:blur(2px);
  }
  .lightbox.open{display:flex;}
  .lightbox-inner{
    background:#fff; border-radius:16px; overflow:hidden; max-width:min(940px, 100%);
    max-height:calc(100vh - 48px); display:flex; flex-direction:column;
  }
  .lightbox-img{background:#0d0f13; display:flex; align-items:center; justify-content:center; overflow:auto;}
  .lightbox-img img{max-width:100%; max-height:66vh; display:block;}
  .lightbox-body{padding:16px 18px 20px; overflow:auto;}
  .lightbox-meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .lightbox-desc{font-size:14px; line-height:1.75; color:#1d1f23; white-space:pre-wrap; word-break:break-word; margin:0 0 12px;}
  .lightbox-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .lightbox-actions a, .lightbox-actions button{
    font-size:12.5px; padding:7px 13px; border-radius:8px; border:1px solid var(--line);
    background:#fff; color:var(--text); text-decoration:none; cursor:pointer; font-family:inherit;
  }
  .lightbox-actions a:hover, .lightbox-actions button:hover{border-color:#c9cdd4;}
  .lightbox-close{
    position:absolute; top:18px; right:20px; width:36px; height:36px; border-radius:50%;
    border:none; background:rgba(255,255,255,.14); color:#fff; font-size:18px; cursor:pointer; line-height:1;
  }
  .lightbox-close:hover{background:rgba(255,255,255,.26);}

  .footnote{margin-top:26px; font-size:12px; color:var(--sub); text-align:center; line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>问题浏览</h1>
      <p class="sub-line">按分类查看小区物业管理问题的记录与现场照片</p>
    </div>
    <a href="./upload.html">新增记录 &rarr;</a>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div class="filters" id="filters">
    <button type="button" class="chip active" data-cat="all">全部</button>
  </div>

  <div class="grid" id="grid"></div>
  <div id="state" class="state" hidden></div>
  <div id="loading" class="loading" hidden>加载中…</div>
  <div id="sentinel"></div>

  <div class="footnote">
    点击任意卡片可查看大图与完整问题描述
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
  <div class="lightbox-inner">
    <div class="lightbox-img"><img id="lightboxImg" alt="问题现场照片"></div>
    <div class="lightbox-body">
      <div class="lightbox-meta">
        <span class="tag" id="lightboxTag"></span>
        <span class="time" id="lightboxTime"></span>
        <span class="time" id="lightboxId"></span>
      </div>
      <p class="lightbox-desc" id="lightboxDesc"></p>
      <div class="lightbox-actions">
        <a id="lightboxOpen" href="#" target="_blank" rel="noopener">新窗口打开原图</a>
        <button type="button" id="lightboxPrev">上一张</button>
        <button type="button" id="lightboxNext">下一张</button>
      </div>
    </div>
  </div>
</div>

<script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    banner: $('banner'),
    filters: $('filters'),
    grid: $('grid'),
    state: $('state'),
    loading: $('loading'),
    sentinel: $('sentinel'),
    lightbox: $('lightbox'),
    lightboxClose: $('lightboxClose'),
    lightboxImg: $('lightboxImg'),
    lightboxTag: $('lightboxTag'),
    lightboxTime: $('lightboxTime'),
    lightboxId: $('lightboxId'),
    lightboxDesc: $('lightboxDesc'),
    lightboxOpen: $('lightboxOpen'),
    lightboxPrev: $('lightboxPrev'),
    lightboxNext: $('lightboxNext')
  };

  var PAGE_SIZE = CONFIG.PAGE_SIZE || 24;

  var state = {
    category: 'all',      // 'all' 或 category_id 字符串
    offset: 0,
    total: null,
    loading: false,
    done: false,
    items: [],            // 已渲染的图片（供灯箱翻页）
    categories: [],
    observer: null
  };

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function showBanner(text, kind) {
    el.banner.hidden = false;
    el.banner.className = 'banner' + (kind ? ' ' + kind : '');
    el.banner.innerHTML = text;
  }

  /* 本地时区：月日时分 */
  function fmtTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function fmtFullTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
      p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  var db = null;
  function initClient() {
    if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY ||
        CONFIG.SUPABASE_URL.indexOf('YOUR-') !== -1 ||
        CONFIG.SUPABASE_ANON_KEY.indexOf('YOUR-') !== -1) {
      showBanner('未配置 SUPABASE_URL 与 SUPABASE_ANON_KEY，请先补全页面头部的 CONFIG 区块。', 'err');
      return false;
    }
    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      showBanner('Supabase JS SDK 加载失败，请检查网络后刷新页面。', 'err');
      return false;
    }
    db = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    return true;
  }

  function publicUrl(filePath) {
    if (!filePath) return '';
    try {
      var r = db.storage.from(CONFIG.BUCKET).getPublicUrl(filePath);
      return (r && r.data && r.data.publicUrl) || '';
    } catch (e) {
      return CONFIG.SUPABASE_URL.replace(/\/+$/, '') + '/storage/v1/object/public/' +
        CONFIG.BUCKET + '/' + filePath;
    }
  }

  /* --------------------------------------------------------------- 分类筛选 */
  function loadCategories() {
    return db.from('categories')
      .select('id,name,sort_order')
      .eq('is_active', true)
      .order('sort_order', { ascending: true })
      .then(function (res) {
        if (res.error) {
          showBanner('分类加载失败：' + res.error.message + '，当前仅能浏览全部问题。', 'warn');
          return;
        }
        var rows = res.data || [];
        var byName = {};
        rows.forEach(function (r) { byName[r.name] = r; });

        var chips = '<button type="button" class="chip active" data-cat="all">全部</button>';
        CONFIG.CATEGORY_ORDER.forEach(function (name) {
          var c = byName[name];
          if (c) {
            state.categories.push(c);
            chips += '<button type="button" class="chip" data-cat="' + c.id + '">' +
              escapeHtml(c.name) + '</button>';
          }
        });
        el.filters.innerHTML = chips;

        var missing = CONFIG.CATEGORY_ORDER.filter(function (n) { return !byName[n]; });
        if (missing.length) {
          showBanner('分类数据不完整，缺少：' + escapeHtml(missing.join('、')) +
            '。请在 Supabase 执行 <code>migration_v2.sql</code>。', 'warn');
        }

        Array.prototype.forEach.call(el.filters.querySelectorAll('.chip'), function (btn) {
          btn.addEventListener('click', function () {
            if (btn.dataset.cat === state.category) return;
            Array.prototype.forEach.call(el.filters.querySelectorAll('.chip'), function (b) {
              b.classList.remove('active');
            });
            btn.classList.add('active');
            state.category = btn.dataset.cat;
            resetAndLoad();
          });
        });
      });
  }

  /* --------------------------------------------------------------- 数据加载 */
  function catName(item) {
    if (item.categories && item.categories.name) return item.categories.name;
    for (var i = 0; i < state.categories.length; i++) {
      if (String(state.categories[i].id) === String(item.category_id)) return state.categories[i].name;
    }
    return '未分类';
  }

  function showState(html) {
    if (!html) { el.state.hidden = true; el.state.innerHTML = ''; return; }
    el.state.hidden = false;
    el.state.innerHTML = html;
  }

  function resetAndLoad() {
    el.grid.innerHTML = '';
    state.offset = 0;
    state.total = null;
    state.done = false;
    state.loading = false;
    state.items = [];
    showState('');
    loadPage();
  }

  function loadPage() {
    if (state.loading || state.done) return;
    state.loading = true;
    el.loading.hidden = false;

    var from = state.offset;
    var to = state.offset + PAGE_SIZE - 1;

    var q = db.from('images')
      .select('id,file_path,file_name,description,category_id,mime_type,created_at,categories(name)',
        { count: 'exact' })
      .order('created_at', { ascending: false })
      .order('id', { ascending: false })
      .range(from, to);

    if (state.category !== 'all') q = q.eq('category_id', Number(state.category));

    q.then(function (res) {
      state.loading = false;
      el.loading.hidden = true;

      if (res.error) {
        showBanner('加载失败：' + res.error.message, 'err');
        showState('<div class="big">!</div>加载失败，请刷新页面重试');
        return;
      }

      var rows = res.data || [];
      if (typeof res.count === 'number') state.total = res.count;

      if (rows.length === 0 && state.offset === 0) {
        showState(
          '<div class="big">▦</div>' +
          (state.category === 'all'
            ? '暂无记录'
            : '该分类下暂无记录')
        );
        state.done = true;
        return;
      }

      rows.forEach(function (row) {
        state.items.push(row);
        el.grid.appendChild(buildCard(row));
      });

      state.offset += rows.length;

      if (rows.length < PAGE_SIZE) {
        state.done = true;
        showState(state.total ? '已显示全部 ' + state.total + ' 条记录' : '');
      }
    });
  }

  function buildCard(row) {
    var card = document.createElement('article');
    card.className = 'card';
    var url = publicUrl(row.file_path);
    var name = catName(row);
    var desc = row.description || '';
    var time = fmtTime(row.created_at);

    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    var img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = desc ? desc.slice(0, 40) : '问题现场照片';
    if (url) img.src = url;
    img.addEventListener('error', function () {
      img.style.display = 'none';
      var ph = document.createElement('div');
      ph.className = 'ph';
      ph.textContent = '图片加载失败';
      thumb.appendChild(ph);
    });
    thumb.appendChild(img);

    var body = document.createElement('div');
    body.className = 'body';
    body.innerHTML =
      '<div class="row">' +
        '<span class="tag" data-t="' + escapeHtml(name) + '">' + escapeHtml(name) + '</span>' +
        '<span class="time">' + escapeHtml(time) + '</span>' +
      '</div>' +
      '<p class="desc">' + escapeHtml(desc || '（未填写问题描述）') + '</p>';

    card.appendChild(thumb);
    card.appendChild(body);

    card.addEventListener('click', function () { openLightbox(row); });
    return card;
  }

  /* --------------------------------------------------------------- 灯箱 */
  var currentIndex = -1;

  function openLightbox(row) {
    currentIndex = state.items.findIndex(function (it) { return String(it.id) === String(row.id); });
    fillLightbox(row);
    el.lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function fillLightbox(row) {
    var url = publicUrl(row.file_path);
    var name = catName(row);
    el.lightboxImg.src = url;
    el.lightboxImg.alt = '问题现场照片';
    el.lightboxTag.textContent = name;
    el.lightboxTag.setAttribute('data-t', name);
    el.lightboxTime.textContent = '记录时间：' + fmtFullTime(row.created_at);
    el.lightboxId.textContent = '编号 #' + row.id;
    el.lightboxDesc.textContent = row.description || '（未填写问题描述）';
    el.lightboxOpen.href = url || '#';
  }

  function closeLightbox() {
    el.lightbox.classList.remove('open');
    el.lightboxImg.removeAttribute('src');
    document.body.style.overflow = '';
    currentIndex = -1;
  }

  function step(dir) {
    if (currentIndex < 0 || state.items.length === 0) return;
    var next = currentIndex + dir;
    if (next < 0) next = state.items.length - 1;
    if (next >= state.items.length) next = 0;
    currentIndex = next;
    fillLightbox(state.items[next]);
  }

  function bindLightbox() {
    el.lightboxClose.addEventListener('click', closeLightbox);
    el.lightbox.addEventListener('click', function (e) {
      if (e.target === el.lightbox) closeLightbox();
    });
    el.lightboxPrev.addEventListener('click', function (e) { e.stopPropagation(); step(-1); });
    el.lightboxNext.addEventListener('click', function (e) { e.stopPropagation(); step(1); });
    document.addEventListener('keydown', function (e) {
      if (!el.lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'ArrowRight') step(1);
    });
  }

  /* --------------------------------------------------------------- 滚动加载 */
  function bindInfiniteScroll() {
    if (!('IntersectionObserver' in window)) {
      window.addEventListener('scroll', function () {
        if (state.loading || state.done) return;
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 400) loadPage();
      }, { passive: true });
      return;
    }
    state.observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) loadPage();
      });
    }, { rootMargin: '600px 0px' });
    state.observer.observe(el.sentinel);
  }

  /* ------------------------------------------------------------------- 启动 */
  function boot() {
    bindLightbox();
    bindInfiniteScroll();
    if (!initClient()) {
      showState('<div class="big">!</div>站点未完成配置');
      return;
    }
    loadCategories().then(function () {
      loadPage();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
