<style>

<body>
<div class="wrap">
  <header>
    <h1>上传图片</h1>
    <a href="./browse.html">查看全部图片 &rarr;</a>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="card">
    <label class="field" for="categorySelect">选择选项</label>
    <select id="categorySelect" disabled>
      <option value="">加载中…</option>
    </select>

    <div class="drop" id="drop">
      <strong>点击选择图片，或把图片拖到这里</strong>
      <span>支持 JPG / PNG / WebP / GIF，单张不超过 10MB，上传前自动压缩</span>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple>

    <div id="list" class="list"></div>

    <div class="actions">
      <button id="uploadBtn" class="btn primary" disabled>开始上传</button>
      <button id="clearBtn" class="btn ghost" disabled>清空列表</button>
    </div>

    <div id="summary" class="summary" hidden></div>
  </section>

  <div class="footnote">图片会压缩到最长边 1920px 后上传，公开可见</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------------- 基础工具 ---------------- */
const $ = function (sel) { return document.querySelector(sel); };
const bannerEl = $('#banner');
const categorySelect = $('#categorySelect');
const dropEl = $('#drop');
const fileInput = $('#fileInput');
const listEl = $('#list');
const uploadBtn = $('#uploadBtn');
const clearBtn = $('#clearBtn');
const summaryEl = $('#summary');

let db = null;
let items = [];          // 待上传队列
let nodes = {};          // key -> DOM 引用
let uploading = false;
let bannerLocked = false; // 配置类提示常驻，不被后续提示覆盖

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function formatBytes(n) {
  if (!n && n !== 0) return '-';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}

function uuid() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    const r = (Math.random() * 16) | 0;
    const v = c === 'x' ? r : ((r & 0x3) | 0x8);
    return v.toString(16);
  });
}

function showBanner(html, type, lock) {
  bannerEl.hidden = false;
  bannerEl.className = 'banner' + (type ? ' ' + type : '');
  bannerEl.innerHTML = html;
  if (lock) bannerLocked = true;
}

function ensureClient() {
  if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) return null;
  if (!db) db = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  return db;
}

function friendlyError(err) {
  const msg = (err && err.message) ? err.message : String(err);
  if (/row-level security|violates row-level/i.test(msg)) {
    return '被数据库安全策略拒绝（请确认已执行 supabase_schema.sql，且上传的是图片、大小不超过 10MB）';
  }
  if (/exceeded the maximum allowed size|too large|EntityTooLarge|maximum allowed size/i.test(msg)) {
    return '文件超过 10MB 上限';
  }
  if (/mime|content type|not allowed/i.test(msg)) return '文件类型不被允许（仅支持 jpg/png/webp/gif）';
  if (/Bucket not found/i.test(msg)) return '存储桶 uploads 不存在，请先执行 supabase_schema.sql';
  if (/Failed to fetch|network|NetworkError/i.test(msg)) return '网络请求失败，请检查网络或 Supabase 项目地址是否正确';
  return msg;
}


/* ---------------- 初始化 ---------------- */
async function loadCategories() {
  const client = ensureClient();
  if (!client) {
    showBanner('尚未配置 Supabase。请用文本编辑器打开本文件，找到顶部的 <code>CONFIG</code> 区块，' +
               '填写 <code>SUPABASE_URL</code> 与 <code>SUPABASE_ANON_KEY</code>，保存后刷新页面。', 'err', true);
    return;
  }

  const res = await client
    .from('categories')
    .select('id, name, sort_order')
    .eq('is_active', true)
    .order('sort_order', { ascending: true })
    .order('id', { ascending: true });

  if (res.error) {
    categorySelect.innerHTML = '<option value="">选项加载失败</option>';
    showBanner('读取选项失败：' + escapeHtml(friendlyError(res.error)) +
               '<br>请确认已在 Supabase 的 SQL Editor 中执行 <code>supabase_schema.sql</code>。', 'err', true);
    return;
  }

  const rows = res.data || [];
  if (rows.length === 0) {
    categorySelect.innerHTML = '<option value="">暂无选项</option>';
    showBanner('categories 表里没有任何选项。请在 SQL Editor 中执行：<br>' +
               '<code>insert into public.categories (name, sort_order) values (\'风景\', 10);</code>', 'warn', true);
    return;
  }

  let html = '<option value="">请选择一个选项…</option>';
  rows.forEach(function (c) {
    html += '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>';
  });
  categorySelect.innerHTML = html;
  categorySelect.dataset.ready = '1';
  categorySelect.disabled = false;
  updateButtons();
}


/* ---------------- 选择文件 ---------------- */
function handleFiles(fileList) {
  const files = Array.prototype.slice.call(fileList || []);
  const rejected = [];
  let added = 0;

  files.forEach(function (f) {
    if (!f.type || f.type.indexOf('image/') !== 0) {
      rejected.push(f.name + '（不是图片）');
      return;
    }
    if (f.size > CONFIG.MAX_FILE_SIZE) {
      rejected.push(f.name + '（' + formatBytes(f.size) + '，超过 10MB）');
      return;
    }
    items.push({
      key: uuid(),
      file: f,
      name: f.name,
      status: 'ready',
      progress: 0,
      note: formatBytes(f.size) + ' · 待上传',
      previewUrl: URL.createObjectURL(f)
    });
    added += 1;
  });

  if (rejected.length) {
    showBanner('已跳过 ' + rejected.length + ' 个文件：' + escapeHtml(rejected.join('；')), 'warn');
  } else if (added > 0 && !bannerLocked) {
    bannerEl.hidden = true;
  }

  renderList();
}

function renderList() {
  listEl.innerHTML = '';
  nodes = {};
  items.forEach(function (item) {
    const root = document.createElement('div');
    root.className = 'item';
    root.innerHTML =
      '<img class="thumb" alt="">' +
      '<div class="meta">' +
        '<div class="name"></div>' +
        '<div class="hint"></div>' +
        '<div class="bar"><i></i></div>' +
      '</div>' +
      '<div class="state"></div>';

    const thumb = root.querySelector('.thumb');
    thumb.src = item.previewUrl;
    root.querySelector('.name').textContent = item.name;

    nodes[item.key] = {
      root: root,
      hint: root.querySelector('.hint'),
      bar: root.querySelector('.bar'),
      fill: root.querySelector('.bar > i'),
      state: root.querySelector('.state')
    };

    listEl.appendChild(root);
    updateItemView(item);
  });
  updateButtons();
}

function updateItemView(item) {
  const n = nodes[item.key];
  if (!n) return;

  n.root.dataset.status = item.status;
  n.hint.textContent = item.note;
  n.hint.title = item.note;

  const showBar = (item.status === 'compressing' || item.status === 'uploading');
  n.bar.style.visibility = showBar ? 'visible' : 'hidden';
  n.fill.style.width = Math.round(Math.max(0, Math.min(1, item.progress)) * 100) + '%';

  const labels = {
    ready: '待上传',
    compressing: '压缩中',
    uploading: '上传 ' + Math.round(item.progress * 100) + '%',
    saving: '写入记录',
    done: '已完成',
    error: '失败'
  };
  n.state.textContent = labels[item.status] || item.status;
}

function updateButtons() {
  const hasPending = items.some(function (i) { return i.status === 'ready' || i.status === 'error'; });
  const ready = categorySelect.dataset.ready === '1';
  uploadBtn.disabled = uploading || !hasPending || !categorySelect.value;
  clearBtn.disabled = uploading || items.length === 0;
  categorySelect.disabled = uploading || !ready;
}


/* ---------------- 压缩 ---------------- */
function loadImage(file) {
  return new Promise(function (resolve, reject) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('图片无法解码')); };
    img.src = url;
  });
}

async function compress(file) {
  // GIF 保留原样，避免动图丢帧
  if (file.type === 'image/gif') {
    return { blob: file, ext: 'gif', mime: 'image/gif', width: null, height: null };
  }

  const img = await loadImage(file);
  const w0 = img.naturalWidth || img.width;
  const h0 = img.naturalHeight || img.height;
  if (!w0 || !h0) throw new Error('图片尺寸异常');

  const scale = Math.min(1, CONFIG.MAX_EDGE / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * scale));
  const h = Math.max(1, Math.round(h0 * scale));

  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';          // 透明背景填白，避免转 JPEG 后变黑
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);

  const blob = await new Promise(function (resolve) {
    canvas.toBlob(resolve, 'image/jpeg', CONFIG.JPEG_QUALITY);
  });
  if (!blob) throw new Error('压缩失败');

  return { blob: blob, ext: 'jpg', mime: 'image/jpeg', width: w, height: h };
}


/* ---------------- 上传（带真实进度） ---------------- */
function uploadWithProgress(path, blob, filename, onProgress) {
  return new Promise(function (resolve, reject) {
    const base = CONFIG.SUPABASE_URL.replace(/\/+$/, '');
    const encodedPath = path.split('/').map(encodeURIComponent).join('/');
    const url = base + '/storage/v1/object/' + CONFIG.BUCKET + '/' + encodedPath;

    const xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader('apikey', CONFIG.SUPABASE_ANON_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + CONFIG.SUPABASE_ANON_KEY);
    xhr.setRequestHeader('x-upsert', 'false');
    xhr.timeout = 120000;

    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable && e.total > 0) onProgress(e.loaded / e.total);
    };
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(xhr.responseText);
      } else {
        reject(new Error('HTTP ' + xhr.status + ' ' + (xhr.responseText || '')));
      }
    };
    xhr.onerror = function () { reject(new Error('Failed to fetch')); };
    xhr.ontimeout = function () { reject(new Error('上传超时')); };

    const fd = new FormData();
    fd.append('cacheControl', '31536000');
    fd.append('', blob, filename);
    xhr.send(fd);
  });
}

function markError(item, msg) {
  item.status = 'error';
  item.note = msg;
  item.progress = 0;
  updateItemView(item);
}

async function uploadOne(item, categoryId) {
  // 1. 压缩
  item.status = 'compressing';
  item.progress = 0.05;
  item.note = '正在压缩…';
  updateItemView(item);

  let out;
  try {
    out = await compress(item.file);
  } catch (e) {
    markError(item, '压缩失败：' + (e.message || e));
    return;
  }

  if (out.blob.size > CONFIG.MAX_FILE_SIZE) {
    markError(item, '压缩后仍有 ' + formatBytes(out.blob.size) + '，超过 10MB 上限');
    return;
  }

  // 2. 上传到存储桶
  const now = new Date();
  const path = now.getFullYear() + '/' +
               String(now.getMonth() + 1).padStart(2, '0') + '/' +
               uuid() + '.' + out.ext;

  item.status = 'uploading';
  item.progress = 0.02;
  item.note = formatBytes(item.file.size) + ' → ' + formatBytes(out.blob.size);
  updateItemView(item);

  try {
    await uploadWithProgress(path, out.blob, item.name, function (p) {
      item.progress = Math.max(0.02, Math.min(0.99, p));
      updateItemView(item);
    });
  } catch (e1) {
    // 服务器已明确返回状态码（如 403 被 RLS 拒绝）时不再重试，直接报错
    const serverSaid = /^HTTP \d{3}/.test(String(e1 && e1.message));
    if (serverSaid) {
      markError(item, '上传失败：' + friendlyError(e1));
      return;
    }
    // 网络层异常时，回退到官方 SDK 再试一次
    try {
      const res = await db.storage.from(CONFIG.BUCKET).upload(path, out.blob, {
        contentType: out.mime,
        upsert: false
      });
      if (res.error) throw res.error;
      item.progress = 1;
      updateItemView(item);
    } catch (e2) {
      markError(item, '上传失败：' + friendlyError(e2.error || e2));
      return;
    }
  }

  // 3. 写入 images 表
  item.status = 'saving';
  item.progress = 1;
  item.note = formatBytes(out.blob.size) + ' · 正在写入记录…';
  updateItemView(item);

  let ins;
  try {
    ins = await db.from('images').insert({
      category_id: categoryId,
      file_path: path,
      file_name: item.name,
      mime_type: out.mime,
      file_size: out.blob.size,
      width: out.width,
      height: out.height
    });
  } catch (e) {
    markError(item, '图片已上传但记录写入失败：' + friendlyError(e));
    return;
  }

  if (ins.error) {
    markError(item, '图片已上传但记录写入失败：' + friendlyError(ins.error));
    return;
  }

  item.status = 'done';
  item.progress = 1;
  item.note = formatBytes(out.blob.size) + ' · 已保存';
  updateItemView(item);
}


/* ---------------- 批量上传 ---------------- */
async function startUpload() {
  if (uploading) return;

  const categoryId = Number(categorySelect.value);
  if (!categoryId) {
    showBanner('请先选择一个选项。', 'warn');
    return;
  }

  const targets = items.filter(function (i) {
    return i.status === 'ready' || i.status === 'error';
  });
  if (!targets.length) return;

  uploading = true;
  summaryEl.hidden = true;
  bannerEl.hidden = true;
  updateButtons();

  for (let i = 0; i < targets.length; i++) {
    try {
      await uploadOne(targets[i], categoryId);
    } catch (e) {
      markError(targets[i], '上传异常：' + friendlyError(e));
    }
  }

  uploading = false;
  updateButtons();

  const ok = targets.filter(function (i) { return i.status === 'done'; }).length;
  const bad = targets.filter(function (i) { return i.status === 'error'; }).length;

  summaryEl.hidden = false;
  summaryEl.className = 'summary ' + (bad > 0 ? 'warn' : 'ok');
  summaryEl.textContent = bad > 0
    ? '本次上传：成功 ' + ok + ' 张，失败 ' + bad + ' 张。失败原因见上方每一项的说明。'
    : '本次上传：成功 ' + ok + ' 张，全部完成。可点击右上角「查看全部图片」确认。';
}


/* ---------------- 事件绑定 ---------------- */
dropEl.addEventListener('click', function () { fileInput.click(); });
dropEl.addEventListener('dragover', function (e) {
  e.preventDefault();
  dropEl.classList.add('over');
});
dropEl.addEventListener('dragleave', function () { dropEl.classList.remove('over'); });
dropEl.addEventListener('drop', function (e) {
  e.preventDefault();
  dropEl.classList.remove('over');
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    handleFiles(e.dataTransfer.files);
  }
});
fileInput.addEventListener('change', function () {
  if (fileInput.files && fileInput.files.length) handleFiles(fileInput.files);
  fileInput.value = '';
});
categorySelect.addEventListener('change', updateButtons);
uploadBtn.addEventListener('click', startUpload);
clearBtn.addEventListener('click', function () {
  if (uploading) return;
  items.forEach(function (i) {
    if (i.previewUrl) URL.revokeObjectURL(i.previewUrl);
  });
  items = [];
  renderList();
  summaryEl.hidden = true;
});

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadCategories);
} else {
  loadCategories();
}
</script>
</body>
</html>
